n\u003eCybersecurity is a collection of several approaches designed to protect against various cyberattacks and threats. Depending on the nature of the attack and the components targeted, we use different types of cybersecurity measures. Here are the major types of cybersecurity.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e1.\tNetwork Security: \u003c/strong\u003e\u003c/b\u003e\u003cspan\u003eProtects data moving across networks using tools like firewalls and encryption to block unauthorized access and attacks.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e2.\tInformation Security (InfoSec):\u003c/strong\u003e\u003c/b\u003e\u003cspan\u003e Protects data in all forms through encryption, access controls, and backup systems, ensuring confidentiality, integrity, and availability.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e3.\tCloud Security:\u003c/strong\u003e\u003c/b\u003e\u003cspan\u003e Secures data, apps, and infrastructure in cloud environments using authentication methods, encryption, and regular audits\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e4.\tEndpoint Security:\u003c/strong\u003e\u003c/b\u003e\u003cspan\u003e Protects devices like laptops, tablets, and smartphones from attacks using monitoring tools that detect and block threats in real time.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eNetwork Security\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eNetwork security is the practice of protecting a computer network and the data moving across it from unauthorized access, misuse and attack. It uses tools such as firewalls, intrusion detection systems, encryption, VPNs and access controls to keep data confidential, accurate and available. By controlling who and what can connect, and by monitoring traffic, it keeps the network safe and working.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eInformation Security (InfoSec)\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eInformation Security (InfoSec) is the practice of protecting data in all its forms (digital, printed or spoken) from unauthorized access, misuse, alteration, loss or destruction. It uses controls such as encryption, access management, backups and security policies to keep information confidential, accurate and available whenever it is needed. Unlike network or endpoint security, which protect specific systems, InfoSec protects the information itself wherever it is stored or sent.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eCloud Security\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eCloud Security is the practice of protecting data, applications and infrastructure hosted in cloud environments from unauthorized access, data breaches and cyber-attacks. It relies on measures such as strong authentication, encryption, access controls, continuous monitoring and regular audits to keep cloud resources safe and compliant with regulations. Responsibility is shared: the cloud provider secures the underlying infrastructure, while the customer secures their own data, settings and user access.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eEndpoint Security\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eEndpoint security is the practice of protecting the devices that connect to a network (the \"endpoints\") from cyber threats. Endpoints include laptops, desktops, smartphones, tablets, servers, virtual machines, and increasingly IoT devices such as printers, cameras and medical equipment. Every endpoint is a possible entry point for attackers. Remote work, personal devices (BYOD) and cloud services mean that the old model of defending a single office network perimeter is no longer enough. A single compromised laptop can let malware, ransomware or a data thief into the whole organization.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"21:T1e7e,"])</script><script>self.__next_f.push([1,"\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eDay 8 - The Recursion Pattern That Opens the Door to Backtracking\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eWhat if every element in a problem gives you two choices?\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eTake it.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eOr leave it.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThis simple idea is one of the most important patterns in recursion.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eLet's understand it with a small example.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eSuppose we have:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e[1, 2, 3]\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eWe want to generate all possible subsequences.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eFor every element, we have two choices.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eFor 1:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eTake 1\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eor\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eDon't take 1\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThen for 2:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eTake 2\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eor\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eDon't take 2\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThen for 3:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eTake 3\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eor\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eDon't take 3\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThis creates a decision tree.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThink like this:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e                 1\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e              /     \\\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e           Take     Don't Take\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e            1           -\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e          /   \\       /   \\\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e        Take  Don't  Take  Don't\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e         2      2      2      2\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eAnd the same choice continues for 3.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eFor [1, 2, 3], the possible subsequences are:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e[1, 2, 3]\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e[1, 2]\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e[1, 3]\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e[1]\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e[2, 3]\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e[2]\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e[3]\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003e[]\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThe important idea is not memorizing these outputs.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eIt is understanding the decision.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eAt every element:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eTake it\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eor\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eSkip it\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThat's it.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eLet's look at the basic recursive structure:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003evoid generate(int index, vector\u0026lt;int\u0026gt;\u0026amp; arr, vector\u0026lt;int\u0026gt;\u0026amp; current) {\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e    if (index == arr.size()) {\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e        // current is one complete subsequence\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e        return;\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003e\u003cstrong\u003e    }\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e    // Take the current element\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e    current.push_back(arr[index]);\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e    generate(index + 1, arr, current);\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e    // Remove it and don't take it\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e    current.pop_back();\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e    generate(index + 1, arr, current);\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003e\u003cstrong\u003e}\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eNotice something important.\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThe recursion does not have just one path.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eEvery element creates two possibilities.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThat's why the recursion tree branches.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eFor 3 elements:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e2 choices × 2 choices × 2 choices\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e= 8 possible subsequences\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eIn general:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eN elements → 2^N possible subsequences\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eINTERVIEW LENS\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eWhen an interviewer gives you a problem where every element can either be selected or ignored, don't immediately try to write complicated code.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eAsk:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e\"Do I have a Take or Not Take choice?\"\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eIf yes, recursion is often a natural starting point.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThis pattern appears in:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eSubsequences\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eSubsets\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eCombination problems\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eKnapsack-style problems\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eMany backtracking problems\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eMEMORY RULE\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eWhenever every element gives you two choices:\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eTake it\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eor\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eDon't take it\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThink:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eTake / Not Take Recursion.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eThe real power of recursion is not just calling the same function again.\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eIt is exploring decisions.\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eOne choice creates one path.\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eAnother choice creates another path.\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eAnd suddenly, a simple Take / Not Take decision becomes a complete search of possibilities.\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eThat's where recursion starts becoming the foundation of backtracking.\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"DSA\" href=\"/community/hashtag/11372/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#DSA\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e \u003c/span\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"Coding\" href=\"/community/hashtag/6527/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#Coding\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e \u003c/span\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"Programming\" href=\"/community/hashtag/6398/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#Programming\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e \u003c/span\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"InterviewPrep\" href=\"/community/hashtag/22203/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#InterviewPrep\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e \u003c/span\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"GeeksforGeeks\" href=\"/community/hashtag/9625/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#GeeksforGeeks\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e \u003c/span\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"Recursion\" href=\"/community/hashtag/6207/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#Recursion\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e \u003c/span\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"Algorithms\" href=\"/community/hashtag/6614/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#Algorithms\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e \u003c/span\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"BeginnerCoding\" href=\"/community/hashtag/25561/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#BeginnerCoding\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e \u003c/span\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"ProblemSolving\" href=\"/community/hashtag/12181/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#ProblemSolving\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e \u003c/span\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"CodingJourney\" href=\"/community/hashtag/12292/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#CodingJourney\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"22:T1aeb,"])</script><script>self.__next_f.push([1,"\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eHow to Design a Payment System in an Application\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eA payment system lets an application accept money from users safely and reliably. The hard part is not calling a payment API. It is making sure a user is never charged twice, an order is never lost, and card data never touches your servers.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eCore Components\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e1. Client (App/Web):\u003c/strong\u003e\u003c/b\u003e\u003cspan\u003e Collects payment details using the gateway's SDK so raw card data goes straight to the gateway.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e2. Payment Service (Backend): \u003c/strong\u003e\u003c/b\u003e\u003cspan\u003eCreates orders, talks to the gateway, and owns payment state.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e3. Payment Gateway:\u003c/strong\u003e\u003c/b\u003e\u003cspan\u003e Stripe, Razorpay, PayPal, etc. Handles authorization with banks and card networks.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e4. Database / Ledger:\u003c/strong\u003e\u003c/b\u003e\u003cspan\u003e Stores every payment and its state changes. It is the source of truth.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003e5. Webhook Handler:\u003c/strong\u003e\u003c/b\u003e\u003cspan\u003e Receives asynchronous status updates from the gateway.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003cb\u003e\u003cstrong\u003ePayment Flow\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e1. User taps Pay. The app asks the backend to create an order.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e2. Backend creates a payment intent with the gateway and returns a client token.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e3. App confirms the payment using the gateway SDK (including 3D Secure / OTP).\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e4. Gateway sends a webhook to the backend with the final status.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e5. Backend verifies the webhook, updates the ledger, and fulfills the order.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e6. Never mark an order as paid based only on the client's response. The client can be closed, offline, or tampered with. The webhook is the confirmation.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003ePayment States\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eModel payments as a state machine:\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003eCREATED -\u0026gt; PENDING -\u0026gt; SUCCEEDED\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e                   -\u0026gt; FAILED\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003eSUCCEEDED -\u0026gt; REFUNDED\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003cspan\u003eOnly allow valid transitions. A FAILED payment must never move to SUCCEEDED without a new attempt.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eIdempotency: Preventing Double Charges\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eNetworks fail and users tap twice. Every payment request should carry an idempotency key, so retries return the original result instead of creating a new charge.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003eapp.post(\"/payments\", async (req, res) =\u0026gt; {\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e  const key = req.headers[\"idempotency-key\"];\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e  const existing = await db.payments.findOne({ idempotencyKey: key });\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e  if (existing) return res.json(existing);\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e  const intent = await gateway.createPayment({\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e    amount: req.body.amount,\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e    currency: \"INR\",\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e    idempotencyKey: key,\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e  });\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e  const payment = await db.payments.insert({\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e    idempotencyKey: key,\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e    gatewayId: intent.id,\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e    status: \"PENDING\",\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e  });\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e  res.json(payment);\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e});\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003cb\u003e\u003cstrong\u003eHandling Webhooks\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eWebhooks can arrive late, more than once, or out of order. Your handler must:\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e- Verify the signature using the gateway's secret.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e- Be idempotent by ignoring events already processed.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e- Respond quickly with 200 and push heavy work to a queue.\u003c/span\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003eapp.post(\"/webhooks/payment\", async (req, res) =\u0026gt; {\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e  if (!gateway.verifySignature(req)) return res.sendStatus(400);\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e  const event = req.body;\u003c/em\u003e\u003c/i\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003ci\u003e\u003cem class=\"GFGEditorTheme__textItalic\"\u003e  if (await db.events.exists(eve

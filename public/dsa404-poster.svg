<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">DSA404 — The execution system for serious DSA preparation</title>
  <desc id="desc">Promotional poster showing DSA404 planning, practice, competition and developer proof features.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101b35"/>
      <stop offset="1" stop-color="#1d1038"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35f2a0"/>
      <stop offset="1" stop-color="#53a7ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#c16cff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#9ab2d8" stroke-opacity=".08"/></pattern>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <circle cx="920" cy="160" r="190" fill="#4f7cff" opacity=".14" filter="url(#glow)"/>
  <circle cx="130" cy="1040" r="210" fill="#35f2a0" opacity=".09" filter="url(#glow)"/>

  <g transform="translate(72 70)">
    <rect width="160" height="42" rx="21" fill="#35f2a0" opacity=".12" stroke="#35f2a0" stroke-opacity=".45"/>
    <circle cx="24" cy="21" r="6" fill="#35f2a0"/>
    <text x="40" y="27" class="mono" font-size="16" font-weight="700" fill="#9fffd0">DSA PREP OS</text>
  </g>

  <text x="72" y="195" class="sans" font-size="100" font-weight="900" letter-spacing="-5" fill="#f5f8ff">DSA<tspan fill="url(#accent)">⁴⁰⁴</tspan></text>
  <text x="76" y="250" class="mono" font-size="22" letter-spacing="3" fill="#8ea4c6">THE EXECUTION SYSTEM FOR SERIOUS DSA PREPARATION</text>
  <text x="72" y="333" class="sans" font-size="48" font-weight="800" fill="#ffffff">Don’t just solve problems.</text>
  <text x="72" y="390" class="sans" font-size="48" font-weight="800" fill="url(#accent)">Build your developer journey.</text>
  <text x="76" y="438" class="sans" font-size="21" fill="#b5c3db">Turn scattered sheets and coding platforms into one adaptive path to interview readiness.</text>

  <g transform="translate(72 500)" filter="url(#shadow)">
    <rect width="936" height="288" rx="26" fill="#111e35" fill-opacity=".9" stroke="#6e86ad" stroke-opacity=".25"/>
    <rect x="24" y="24" width="888" height="48" rx="12" fill="#0a1325"/>
    <circle cx="52" cy="48" r="6" fill="#ff657a"/><circle cx="74" cy="48" r="6" fill="#ffc45a"/><circle cx="96" cy="48" r="6" fill="#35f2a0"/>
    <text x="130" y="55" class="mono" font-size="15" fill="#7f96b9">today / dsa404 / preparation-dashboard</text>
    <text x="54" y="125" class="mono" font-size="16" fill="#7c9bc2">$ ./build-your-consistency</text>
    <text x="54" y="165" class="mono" font-size="25" font-weight="700" fill="#ffffff">Plan → Practice → Review → Prove</text>
    <rect x="54" y="198" width="530" height="12" rx="6" fill="#243858"/>
    <rect x="54" y="198" width="370" height="12" rx="6" fill="url(#accent)"/>
    <text x="54" y="245" class="mono" font-size="14" fill="#9db1d0">DAILY MOMENTUM</text>
    <text x="780" y="239" class="sans" font-size="28" font-weight="800" fill="#35f2a0">70%</text>
  </g>

  <g transform="translate(72 840)">
    <g>
      <rect width="438" height="170" rx="22" fill="#101d33" stroke="#35f2a0" stroke-opacity=".35"/>
      <circle cx="42" cy="42" r="22" fill="#35f2a0" opacity=".16"/><text x="34" y="50" class="sans" font-size="24" fill="#35f2a0">✓</text>
      <text x="78" y="48" class="sans" font-size="23" font-weight="800" fill="#ffffff">PLAN SMARTER</text>
      <text x="30" y="92" class="sans" font-size="18" fill="#b7c6dd">Daily workspace · curated sheets</text>
      <text x="30" y="123" class="sans" font-size="18" fill="#b7c6dd">Adaptive roadmap · backlog recovery</text>
    </g>
    <g transform="translate(460 0)">
      <rect width="438" height="170" rx="22" fill="#101d33" stroke="#6d9eff" stroke-opacity=".35"/>
      <circle cx="42" cy="42" r="22" fill="#6d9eff" opacity=".16"/><text x="31" y="50" class="sans" font-size="24" fill="#6d9eff">⌁</text>
      <text x="78" y="48" class="sans" font-size="23" font-weight="800" fill="#ffffff">PRACTICE CONSISTENTLY</text>
      <text x="30" y="92" class="sans" font-size="18" fill="#b7c6dd">Topics · notes · code editor</text>
      <text x="30" y="123" class="sans" font-size="18" fill="#b7c6dd">Reviews · streaks · progress charts</text>
    </g>
    <g transform="translate(0 194)">
      <rect width="438" height="170" rx="22" fill="#101d33" stroke="#c16cff" stroke-opacity=".35"/>
      <circle cx="42" cy="42" r="22" fill="#c16cff" opacity=".16"/><text x="30" y="50" class="sans" font-size="24" fill="#c16cff">★</text>
      <text x="78" y="48" class="sans" font-size="23" font-weight="800" fill="#ffffff">COMPETE & IMPROVE</text>
      <text x="30" y="92" class="sans" font-size="18" fill="#b7c6dd">Contest radar · countdowns</text>
      <text x="30" y="123" class="sans" font-size="18" fill="#b7c6dd">Badges · activity heatmaps</text>
    </g>
    <g transform="translate(460 194)">
      <rect width="438" height="170" rx="22" fill="#101d33" stroke="#ffc45a" stroke-opacity=".35"/>
      <circle cx="42" cy="42" r="22" fill="#ffc45a" opacity=".16"/><text x="30" y="50" class="sans" font-size="24" fill="#ffc45a">↗</text>
      <text x="78" y="48" class="sans" font-size="23" font-weight="800" fill="#ffffff">BUILD PUBLIC PROOF</text>
      <text x="30" y="92" class="sans" font-size="18" fill="#b7c6dd">Coding profiles · GitHub proof</text>
      <text x="30" y="123" class="sans" font-size="18" fill="#b7c6dd">Solved archive · public profile</text>
    </g>
  </g>

  <g transform="translate(72 1230)">
    <text x="0" y="0" class="sans" font-size="28" font-weight="800" fill="#ffffff">One plan. Every problem. Visible progress.</text>
    <rect x="0" y="28" width="300" height="58" rx="29" fill="url(#accent)"/>
    <text x="150" y="65" text-anchor="middle" class="sans" font-size="20" font-weight="900" fill="#07111f">START YOUR PLAN →</text>
    <text x="650" y="62" class="mono" font-size="16" fill="#8ea4c6">dsa404 · built for ambitious developers</text>
  </g>
</svg>
